[workspace]
members = [
    "crates/rllm-core",
    "crates/rllm-backend-cpu",
    "crates/rllm-backend-metal",
    "crates/rllm-models",
    "crates/rllm-scheduler",
    "crates/rllm-rag",
    "crates/rllm-server",
    "crates/rllm-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["rllm contributors"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/rllm/rllm"

[workspace.dependencies]
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
rayon = "1.10"
parking_lot = "0.12"
memmap2 = "0.9"
half = { version = "2.4", features = ["serde", "num-traits"] }
byteorder = "1.5"
rand = "0.8"
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"

# Internal crates
rllm-core = { path = "crates/rllm-core" }
rllm-backend-cpu = { path = "crates/rllm-backend-cpu" }
rllm-backend-metal = { path = "crates/rllm-backend-metal" }
rllm-models = { path = "crates/rllm-models" }
rllm-scheduler = { path = "crates/rllm-scheduler" }
rllm-rag = { path = "crates/rllm-rag" }
rllm-server = { path = "crates/rllm-server" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
debug = true

